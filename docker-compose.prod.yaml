# DBG – production stack: nginx (static site) + Strapi + PostgreSQL.
#
# Unlike docker-compose.yaml, nothing is bind-mounted: both images are built from the
# repo and Strapi runs `strapi start` against a pre-built admin, not `develop`.
#
#   cp .env.example .env          # then replace every secret
#   docker compose -f docker-compose.prod.yaml up --build -d
#
# Two values must be the public origins the *browser* sees, not container addresses:
#   VITE_STRAPI_URL     – baked into the frontend bundle at build time
#   STRAPI_PUBLIC_URL   – used by Strapi to build uploaded-media URLs
#
# Loading content into a fresh database is a `strapi import` — see DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: dbg-strapi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-strapi}
    volumes:
      - dbg_strapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-strapi}']
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile.prod
    container_name: dbg-strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Uploaded media must outlive the container.
      - dbg_strapi_uploads:/srv/app/public/uploads
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_SSL: 'false'
      STRAPI_PUBLIC_URL: ${STRAPI_PUBLIC_URL:?set STRAPI_PUBLIC_URL in .env}
      STRAPI_CORS_ORIGINS: ${STRAPI_CORS_ORIGINS:?set STRAPI_CORS_ORIGINS in .env}
      APP_KEYS: ${APP_KEYS:?set APP_KEYS in .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
    ports:
      - '1337:1337'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite inlines this at build time, so it is a build arg, not a runtime env var.
        VITE_STRAPI_URL: ${VITE_STRAPI_URL:?set VITE_STRAPI_URL in .env}
    container_name: dbg-web
    restart: unless-stopped
    depends_on:
      - strapi
    ports:
      - '8080:80'

volumes:
  dbg_strapi_pgdata:
  dbg_strapi_uploads:
