server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build output — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The shell must never be cached, or a deploy leaves clients on stale asset hashes.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: BrowserRouter owns the routing, so deep links like /events/<id>
  # have to resolve to index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
