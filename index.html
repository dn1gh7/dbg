    <script>
      // The site used HashRouter while it was hosted on GitHub Pages. Rewrite any
      // surviving /#/… bookmark to its real path so old links keep working.
      (function () {
        var hash = window.location.hash;
        if (hash.indexOf('#/') === 0) {
          window.location.replace(
            window.location.pathname.replace(/\/$/, '') + hash.slice(1)
          );
        }
      })();
    </script>
